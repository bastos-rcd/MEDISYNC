services:
  medisync-db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: medisyncdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      TZ: Europe/Paris
    volumes:
      - medisync_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  medisync-api:
    build:
      context: ./api
    expose:
      - "3000"
    environment:
      PORT: 3000
      DB_HOST: medisync-db
      DB_PORT: 5432
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: medisyncdb
      JWT_SECRET: defegrnfdeadeozof
    depends_on:
      - medisync-db
    restart: unless-stopped

volumes:
  medisync_data:
