<div class="flex flex-col">
  <div class="w-full bg-white p-5 mb-5">
    <h1 class="text-5xl">Tableau de bord</h1>
  </div>
  <div class="flex flex-row gap-5 justify-around w-full">
    <app-kpi-card
      title="Personnel présent"
      [value]="8"
      [description]="'sur 12 employés'"
      icon="/icons/profile.svg"
      [max]="12"
      chartType="circle"
      class="flex-1 max-w-100"
    />
    <app-kpi-card
      title="Demandes en attente"
      [value]="5"
      description="à traiter aujourd'hui"
      icon="/icons/leave.svg"
      chartType="gauge"
      [max]="12"
      class="flex-1 max-w-100"
    />
    <app-kpi-card
      title="Taux de couverture"
      [value]="75"
      description="cette semaine"
      icon="/icons/calendar.svg"
      [max]="100"
      chartType="circle"
      class="flex-1 max-w-100"
    />
    <app-kpi-card
      title="Heures supplémentaires"
      [value]="13"
      description="cette semaine"
      icon="/icons/calendar.svg"
      chartType="gauge"
      [max]="20"
      class="flex-1 max-w-100"
    />
  </div>
  <div class="grid grid-cols-2 justify-around gap-10 m-10 items-start">
    <div class="flex flex-col bg-white p-5 rounded-2xl w-full gap-5">
      <div class="flex flex-row items-center gap-10">
        <img src="/icons/leave.svg" alt="leave icon" class="w-15" />
        <h1>Demandes en attentes</h1>
      </div>
      <div class="flex flex-col w-full justify-between">
        @for (leave of leaves.slice(0, 4); track leave.id) {
          <app-leave-card [leave]="leave" />
        }
        <button
          class="underline underline-offset-1 text-lg text-navbar cursor-pointer"
          routerLink="/absences"
        >
          Voir plus
        </button>
      </div>
    </div>
    <div class="flex flex-col bg-white p-5 rounded-2xl w-full">
      <div class="flex flex-row items-center gap-10 mb-5">
        <i class="fa-solid fa-triangle-exclamation text-red-alert text-5xl"></i>
        <h1>Alertes conformités</h1>
      </div>
      <app-alerts-card bgColor="bg-red-300" iconColor="text-red-alert" />
      <app-alerts-card bgColor="bg-orange-300" iconColor="text-orange-alert" />
      <app-alerts-card bgColor="bg-orange-300" iconColor="text-orange-alert" />
      <app-alerts-card bgColor="bg-green-300" iconColor="text-green" />
    </div>
  </div>
</div>
