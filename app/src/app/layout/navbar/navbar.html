<div
  class="bg-navbar flex flex-col items-center justify-between h-screen text-background transition-all duration-00 ease-in-out"
  [class.w-30]="!isOpen()"
  [class.w-64]="isOpen()"
  (mouseenter)="toggleOpen()"
  (mouseleave)="toggleOpen()"
>
  <div class="flex flex-col items-center w-full gap-20">
    @if (!isOpen()) {
      <img class="w-24 mt-5" src="/logo/logo-mobile.webp" alt="Logo" />
    } @else {
      <img
        class="w-full"
        [class.bg-background]="isOpen()"
        src="/logo/logo-desktop-clear.svg"
        alt="Logo"
      />
    }
    <div class="flex flex-col items-center w-full gap-12">
      <div
        class="flex flex-row items-center w-full gap-4 cursor-pointer"
        [class.justify-start]="isOpen()"
        [class.justify-center]="!isOpen()"
        [class.gap-4]="isOpen()"
        [class.px-8]="isOpen()"
        routerLink="/"
      >
        <img class="w-10 shrink-0" src="/icons/dashboard.svg" alt="Dashboard" />
        @if (isOpen()) {
          <h3 class="text-background">Dashboard</h3>
        }
      </div>
      <div
        class="flex flex-row items-center w-full gap-4 cursor-pointer"
        [class.justify-start]="isOpen()"
        [class.justify-center]="!isOpen()"
        [class.gap-4]="isOpen()"
        [class.px-8]="isOpen()"
        routerLink="/planning"
      >
        <img class="w-10 shrink-0" src="/icons/calendar.svg" alt="Calendar" />
        @if (isOpen()) {
          <h3 class="text-background">Planning</h3>
        }
      </div>
      <div
        class="flex flex-row items-center w-full gap-4 cursor-pointer"
        [class.justify-start]="isOpen()"
        [class.justify-center]="!isOpen()"
        [class.gap-4]="isOpen()"
        [class.px-8]="isOpen()"
        routerLink="/absences"
      >
        <img class="w-10 shrink-0" src="/icons/leave.svg" alt="Leave" />
        @if (isOpen()) {
          <h3 class="text-background">Absences</h3>
        }
      </div>
      <div
        class="flex flex-row items-center w-full gap-4 cursor-pointer"
        [class.justify-start]="isOpen()"
        [class.justify-center]="!isOpen()"
        [class.gap-4]="isOpen()"
        [class.px-8]="isOpen()"
        routerLink="/team"
      >
        <img class="w-10 shrink-0" src="/icons/profile.svg" alt="Profile" />
        @if (isOpen()) {
          <h3 class="text-background">Équipe</h3>
        }
      </div>
    </div>
  </div>
  <div
    class="flex flex-row items-center w-full gap-4 mb-5 cursor-pointer"
    [class.justify-start]="isOpen()"
    [class.justify-center]="!isOpen()"
    [class.gap-4]="isOpen()"
    [class.px-8]="isOpen()"
    routerLink="/profile"
  >
    <div class="bg-cyan p-3 rounded-full">
      <p>CM</p>
    </div>
    <div class="flex flex-col">
      @if (isOpen()) {
        <h3 class="text-background">Claire Marie</h3>
        <p>Infirmière</p>
      }
    </div>
  </div>
</div>
