<div
  class="grid items-center bg-bakground rounded-lg border-2 border-primary p-5 bg-background mb-5"
  [class.grid-cols-9]="!session.isManager()"
  [class.grid-cols-12]="session.isManager()"
>
  <div class="flex flex-row gap-3 items-center col-span-3">
    <div class="bg-navbar p-3 rounded-full">
      <p class="text-white">{{ user()?.firstName?.[0] }}{{ user()?.lastName?.[0] }}</p>
    </div>
    <h3>{{ user()?.firstName }} {{ user()?.lastName }}</h3>
  </div>
  <p class="col-span-2">{{ user()?.job?.name }}</p>
  <p class="col-span-2">{{ user()?.workingTime }}</p>
  <p class="col-span-2">{{ user()?.email }}</p>
  @if (session.isManager()) {
    <div class="flex flex-row justify-end gap-5 col-span-3">
      <i class="fa-solid fa-pen cursor-pointer" (click)="editUser.emit(user())"></i>
      <i class="fa-solid fa-trash cursor-pointer" (click)="deleteUser.emit(user())"></i>
    </div>
  }
</div>
