services:
  medisync-db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: medisyncdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      TZ: Europe/Paris
    volumes:
      - medisync_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

volumes:
  medisync_data:
